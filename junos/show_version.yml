---
- name: Read-only show version
  hosts: all
  gather_facts: false
  connection: netconf

  tasks:
    - name: Run show version
      junipernetworks.junos.junos_command:
        commands:
          - show version
      register: show_version
      # Read-only. junos_command refuses any RPC in check mode ("invalid rpc for
      # running in check_mode"), so a Test (dry run) would fail here otherwise.
      check_mode: false

    - name: Print the output
      debug:
        var: show_version.stdout_lines
